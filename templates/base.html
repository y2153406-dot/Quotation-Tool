<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Quotejam - Smart Quotation Management{% endblock %}
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <style>

        body {
            background: #f8fafc;
        }


        .navbar-brand {
            transition: opacity 0.2s ease;
        }


        .navbar-brand:hover {
            opacity: 0.85;
        }


        .nav-link {
            transition: color 0.2s ease;
        }


        .nav-link:hover {
            color: #0d6efd !important;
        }


        /* Quotejam Logo */

        .brand-quote {
            color: #0d6efd;
        }


        .brand-jam {
            color: #ff7a00;
        }


        .brand-icon {
            width: 42px;
            height: 42px;

            background: #0d6efd;

            color: white;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>


    {% block extra_css %}{% endblock %}

</head>


<body class="min-h-screen">


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="bg-white border-bottom shadow-sm">

        <div class="container-fluid px-4 px-lg-5">

            <div
                class="d-flex justify-content-between align-items-center py-3"
            >


                <!-- BRAND -->

                <a
                    href="{% url 'home' %}"
                    class="navbar-brand text-decoration-none d-flex align-items-center gap-2"
                >

                    <div class="brand-icon">

                        <i class="bi bi-receipt fs-5"></i>

                    </div>


                    <div>

                        <h5 class="mb-0 fw-bold">

                            <span class="brand-quote">
                                Quote
                            </span><span class="brand-jam">jam</span>

                        </h5>


                        <small class="text-secondary">
                            Smart quotation management
                        </small>

                    </div>

                </a>



                <!-- NAVIGATION -->

                <div
                    class="d-flex align-items-center gap-2 gap-md-4"
                >

                    <a
                        href="{% url 'home' %}"
                        class="text-decoration-none text-dark fw-medium d-none d-md-block nav-link"
                    >

                        <i class="bi bi-house me-1"></i>

                        Home

                    </a>


                    <a
                        href="{% url 'quotation_dashboard' %}"
                        class="text-decoration-none text-dark fw-medium d-none d-md-block nav-link"
                    >

                        <i class="bi bi-speedometer2 me-1"></i>

                        Dashboard

                    </a>


                    <a
                        href="{% url 'quote_request' %}"
                        class="text-decoration-none text-dark fw-medium d-none d-md-block nav-link"
                    >

                        <i class="bi bi-file-earmark-plus me-1"></i>

                        Request a Quote

                    </a>


                    <a
                        href="/admin/"
                        class="btn btn-outline-primary btn-sm px-3"
                    >

                        <i class="bi bi-person-circle me-1"></i>

                        Admin

                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        {% block content %}

        {% endblock %}

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="bg-white border-top mt-5">

        <div class="container py-4">

            <div class="row align-items-center">

                <div class="col-md-6">

                    <p class="mb-0 text-secondary small">

                        © 2026

                        <span class="fw-semibold">

                            <span class="brand-quote">
                                Quote
                            </span><span class="brand-jam">jam</span>

                        </span>

                        . All rights reserved.

                    </p>

                </div>


                <div class="col-md-6 text-md-end mt-2 mt-md-0">

                    <span class="text-secondary small">

                        Powered by Django

                    </span>

                </div>

            </div>

        </div>

    </footer>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    {% block extra_js %}{% endblock %}

</body>

</html>
