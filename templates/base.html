<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Quotation Tool{% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background: #f8fafc;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white border-bottom shadow-sm">
        <div class="container-fluid px-4 px-lg-5">
            <div class="d-flex justify-content-between align-items-center py-3">

                <!-- Logo -->
                <a
                    href="/"
                    class="text-decoration-none d-flex align-items-center gap-2"
                >
                    <div
                        class="bg-primary text-white rounded-3 d-flex align-items-center justify-content-center"
                        style="width: 42px; height: 42px;"
                    >
                        <i class="bi bi-receipt fs-5"></i>
                    </div>

                    <div>
                        <h5 class="mb-0 fw-bold text-dark">
                            Quotation Tool
                        </h5>

                        <small class="text-secondary">
                            Smart quotation management
                        </small>
                    </div>
                </a>

                <!-- Navigation -->
                <div class="d-flex align-items-center gap-3">

                    <a
                        href="/request-quote/"
                        class="text-decoration-none text-dark fw-medium d-none d-md-block"
                    >
                        Request a Quote
                    </a>

                    <a
                        href="/admin/"
                        class="btn btn-outline-primary btn-sm px-3"
                    >
                        <i class="bi bi-person-circle me-1"></i>
                        Admin
                    </a>

                </div>

            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="bg-white border-top mt-5">
        <div class="container py-4">

            <div class="row align-items-center">

                <div class="col-md-6">
                    <p class="mb-0 text-secondary small">
                        © 2026 Quotation Tool. All rights reserved.
                    </p>
                </div>

                <div class="col-md-6 text-md-end mt-2 mt-md-0">
                    <span class="text-secondary small">
                        Powered by Django
                    </span>
                </div>

            </div>

        </div>
    </footer>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
